# Introtekst

​Ik wil anderen vertellen dat haaien best wel wat coole facts hebben en meedelen hoe belangrijk zij zijn voor het ecosysteem

Ik wil vertellen dmv veel tekst maar ook leuke interactieve elementen, afbeeldingen en misschien filmpjes.

Haaien zijn een van de oudste diersoorten op aarde. Zij bestaan al ongeveer 400 miljoen jaren, dat is zelfs ouder dan dinosaurussen! Zij hebben een zeer goede geheugen, en zelfs probleem-oplossende vaardigheden. Dus slimme dieren ook. Zij zijn een heel belangrijk onderdeel van het mariene ecosysteem en zorgen voor de balans en gezondheid van de oceanen. 
Haaien worden vaak verkeerd begrepen door de mens. Wij zien de haaienfilms en denken vaak dat zij agressieve jagers zijn, die bij elke kans die ze krijgen graag een mens op het menu hebben staan. Maar dat is helemaal niet zo. Per jaar sterven gemiddeld 10 personen aan een haaienaanval, in vergelijking tot 100 miljoen haaien die elk jaar sterven door de mens. Wie vormt dus de echte bedreiging? Haaien zijn inderdaad een bedreigde diersoort, en dat komt door de mens. Hoe kunnen wij deze bedreiging tegengaan? Hoe lossen wij het op?
